name: Build and Test
on: 
  push: {branches: ["main"]}
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        type: string
        required: false
        description: Comparison baseline for benchmark

jobs:
  ci-enumerate:
    name: Enumerate GHC Versions
    runs-on: ubuntu-latest
    outputs:
      plan: ${{steps.list-ci.outputs.plan}}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - name: Enumerate CI plans
      id: list-ci
      uses: actions/github-script@v8
      with:
        script: |
          const script = require('./ci/scripts/enumerate-ci.js')
          await script({github, context, core, glob, io, require})

  build:
    name: Build and Test (${{matrix.plan.name}})
    needs: [ci-enumerate]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        plan: ${{fromJSON(needs.ci-enumerate.outputs.plan)}}
    env:
      cabal-version: 3.16.1.0
      cabal: cabal --project-file=${{matrix.plan.path}}
      ghc: ${{matrix.plan.ghc}}
      project-file: ${{matrix.plan.path}}
      plan: ${{matrix.plan.name}}
      artifact-name: artifact-${{matrix.plan.name}}
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{steps.list-bins.outputs.benchs}}
      tests: ${{steps.list-bins.outputs.tests}}
      artifact: artifact-${{matrix.plan.name}}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - name: Calculate hash keys
      uses: actions/github-script@v8
      id: cache-keys
      with:
        script: |
          const script = require('./ci/scripts/calc-cache-keys.js')
          await script({ os: "ubuntu", plan: ${{toJSON(env.plan)}}, path: ${{toJSON(env.project-file)}}, core, glob })

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        enable-stack: false
        cabal-version: ${{env.cabal-version}}
        ghc-version: ${{env.ghc}}
    - name: Restore ~/.cabal/store
      uses: actions/cache/restore@v4
      with:
        path: ~/.cabal/store
        key: ${{steps.cache-keys.outputs.store}}
        restore-keys: ${{steps.cache-keys.outputs.store-restore}}
    - name: Restore dist-newstyle
      uses: actions/cache/restore@v4
      with:
        path: dist-newstyle
        key: ${{steps.cache-keys.outputs.dist}}
        restore-keys: ${{steps.cache-keys.outputs.dist-restore}}
    - name: cabal configure
      run: |
        ${{env.cabal}} v2-configure --enable-tests --enable-benchmarks --enable-optimisation=2 --constraint="herbrand +bench-chart"
        ${{env.cabal}} update
    - name: Build Dependencies
      run: |
        ${{env.cabal}} build --only-dependencies all
    - name: Save ~/.cabal/store Cache
      uses: actions/cache/save@v4
      with:
        path: ~/.cabal/store
        key: ${{steps.cache-keys.outputs.store}}
    - name: Build All
      run: |
        ${{env.cabal}} build all
    - name: Save dist-newstyle Cache
      uses: actions/cache/save@v4
      with:
        path: dist-newstyle
        key: ${{steps.cache-keys.outputs.dist}}

    - name: Collect binaries
      continue-on-error: true
      run: ./ci/scripts/collect-bins.sh "${{env.artifact-name}}"
    - name: Upload Aritracts
      uses: actions/upload-artifact@v4
      with:
        path: ${{env.artifact-name}}.tar.zst
        name: ${{env.artifact-name}}
        retention-days: 1
    - name: List Binaries
      id: list-bins
      shell: bash
      run: |
        echo "benchs=$(jq -cMnR '[inputs]' <"${{env.artifact-name}}"/benchs.list)" >>"${GITHUB_OUTPUT}"
        echo "tests=$(jq -cMnR '[inputs]' <"${{env.artifact-name}}"/tests.list)" >>"${GITHUB_OUTPUT}"
    - name: Run Tests
      run: ${{env.cabal}} test
      
  bench:
    name: Benchrmark
    needs: [ci-enumerate, build]
    env:
      ghc: 9.12.4
      cabal: 3.16.1.0
      csv-path: bench-results/${{matrix.bench}}.csv
      svg-path: bench-results/${{matrix.bench}}.svg
      report-dir: bench-results/${{matrix.bench}}-report
      report-tarball: bench-results/${{matrix.bench}}-report.tar.gz
      branch: ${{ github.head_ref || github.ref_name }}
      artifact: artifact-ghc-9.12.4
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        bench: ${{fromJSON(needs.build.outputs.benchmarks)}}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - name: Modify Branch Name
      run: git switch -c ${{env.branch}}
    - name: Download artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        name: ${{env.artifact}}
    - name: Decompress
      run: tar xaf "${{steps.download.outputs.download-path}}/${{env.artifact}}.tar.zst"
    - name: Run Benchmark
      uses: actions/github-script@v8
      id: benchmark
      with:
        script: |
          const script = require('./ci/scripts/compare-with-main.js')
          await script({
            core, glob, io, exec, context, github, fetch,
            bench_name: "${{matrix.bench}}",
            threshold: 20, inputs: ${{toJSON(inputs)}}
          })
    - name: Upload CSV
      if: always()
      uses: actions/upload-artifact@v4
      with:
        path: ${{env.csv-path}}
        name: ${{matrix.bench}}.csv
    - name: Upload SVG
      if: always()
      uses: actions/upload-artifact@v4
      with:
        path: ${{env.svg-path}}
        name: ${{matrix.bench}}.svg
    
    - name: Generate Report
      if: always()
      shell: bash
      run: |
        BASELINE=${{steps.benchmark.outputs.baseline-csv}}
        BASELINE_DESC=$(cat <<"STOP_HERE_EOF_HERE"
        ${{steps.benchmark.outputs.baseline-desc}}
        STOP_HERE_EOF_HERE
        )
        PULL=${{github.event.pull_request.number}}
        PULL_BASE_BRANCH=${{github.event.pull_request.head.ref}}
        PULL_BASE_COMMIT=${{github.event.pull_request.head.sha}}
        PULL_TITLE="${{github.event.pull_request.title}}"

        ARGS=(--git --repo "${{github.event.repository.full_name}}")
        ARGS+=(-i "${{env.csv-path}}" -o "${{env.report-dir}}")
        ARGS+=(-R "${{matrix.bench}}")

        if [[ -n "${BASELINE}" ]]; then
          ARGS+=(--baseline "${BASELINE}")
          ARGS+=(--baseline-desc "${BASELINE_DESC}")
          ARGS+=(--pull-number "${PULL}")
          ARGS+=(--pull-title "${PULL_TITLE}")
          ARGS+=(--pull-base-branch "${PULL_BASE_BRANCH}")
          ARGS+=(--pull-base-commit "${PULL_BASE_COMMIT}")
        fi
        ./${{env.artifact}}/exes/bench-chart "${ARGS[@]}"

    - name: Compress Report
      if: always()
      run: >
        tar
        czvf "${{env.report-tarball}}"
        --directory=bench-results
        "${{matrix.bench}}-report"
    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        path: ${{env.report-tarball}}
        name: ${{matrix.bench}}-report

  codspeed:
    name: CodSpeed
    needs: [build]
    continue-on-error: true
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write   # tokenless OIDC upload (public repo)
    runs-on: ubuntu-latest
    env:
      artifact: artifact-ghc-9.12.4
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - name: Download artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        name: ${{env.artifact}}
    - name: Decompress
      run: tar xaf "${{steps.download.outputs.download-path}}/${{env.artifact}}.tar.zst"
    - name: Install CodSpeed CLI
      run: |
        curl -fsSL https://codspeed.io/install.sh | bash
        echo "${HOME}/.codspeed/bin" >>"${GITHUB_PATH}"
    # No CODSPEED_TOKEN: static tokens are legacy, and the CLI skips OIDC
    # entirely whenever a token is present. `${{secrets.X}}` for an unset secret
    # expands to the empty string, which clap still binds as Some(""), so setting
    # it at all disables OIDC and uploads with an empty key.
    #
    # The binary is measured directly rather than through a codspeed.yml exec
    # target. The suite now links haskell-codspeed, so every `bench` leaf opens
    # its own measurement window and is reported individually. Measuring the
    # whole process instead put ~76% of the number in performMajorGC and ~23% in
    # startup and input loading, leaving 1-2% describing the solver.
    #
    # The RTS options override the stanza's baked-in set, which stays as it is
    # for the `bench` job and workspace/TUNING-PLAN.md. -V0 silences the ticker,
    # which fires far too often against work running ~200x slow under Valgrind;
    # -I0 stops collections happening merely because the process paused; and
    # --copying-gc overrides --nonmoving-gc, whose concurrent marking would land
    # inside measured windows. -A32m -T are repeated so this line is the whole
    # contract rather than half of it.
    #
    # Only four of the 36 corpus files are measured, because the whole suite
    # took 29 min. The measured windows were just 140 s of that: at ~3.6 s of
    # Valgrind overhead per leaf, wall time tracks the *number* of leaves far
    # more than the work in them, so cutting cases is the only lever that
    # matters. 48 leaves projects to ~4.5 min.
    #
    # Four of the six are workspace/TUNING-PLAN.md's own frozen SAT corpus, so
    # this is largely the project's existing notion of a representative case
    # rather than a new one. They span uniform-random small (uf20-91),
    # uniform-random medium (uf100-430), phase-transition hard (flat200-479) and
    # structured/crafted (Bejing/3blocks).
    #
    # Sudoku/9x9/1 adds a second, differently-structured family; 9x9/2 is three
    # times the cost for the same kind of coverage.
    #
    # uuf100-430/uuf100-01 is the unsatisfiable counterpart of uf100-430: same
    # 100 variables, same 430 clauses, same ratio, opposite satisfiability.
    # Refuting one drives conflict analysis and clause learning to exhaustion
    # rather than stopping at the first satisfying assignment, so without it a
    # regression confined to that path could pass this gate. Pairing it with an
    # otherwise identical satisfiable instance is what isolates the difference.
    # TUNING-PLAN's own three UNSAT cases could not be used: they lived under the
    # gitignored workspace/tuning-corpus/ and no longer exist anywhere.
    #
    # The uf100 terms are directory-qualified on purpose. Plain /uf100-01.cnf/ is
    # a substring of uuf100-01.cnf and silently selects both.
    #
    # flat200-10.cnf is the one to keep out: on its own it was 58% of all
    # measured time, with a single leaf at 23 s.
    #
    # Coverage is not lost -- the `bench` job still runs all 432 leaves. What
    # narrows is the CodSpeed regression gate.
    #
    # Patterns are bare regexes, so `.` is a wildcard; `/uf100-01.cnf/` still
    # cannot match uf100-010.cnf, which would need "cnf" three characters after
    # "uf100-01".
    #
    # The pattern goes through TASTY_PATTERN, not --pattern, and it has to. The
    # runner re-joins the command it is given and re-runs it through a shell, so
    # the quotes this step wrote are already gone by then and `||` is read as a
    # shell operator. The observed result was `bench --pattern /uf20-01.cnf/`
    # succeeding and short-circuiting everything after it -- 12 benchmarks
    # instead of 48, and the whole +RTS block silently never applied, which
    # preflight caught as --nonmoving-gc still being on. An environment variable
    # never reaches a shell. Keep it that way: no argument here may contain
    # shell metacharacters.
    - name: Run CodSpeed benchmarks
      env:
        # Per-benchmark allocation, written by the suite itself. Exact and
        # deterministic, and the metric CodSpeed has no channel for.
        CODSPEED_HS_SIDECAR: ${{github.workspace}}/allocation.csv
        TASTY_PATTERN: /uf20-01.cnf/ || /uf100-430.uf100-01.cnf/ || /uuf100-430.uuf100-01.cnf/ || /flat200-1.cnf/ || /3blocks/ || /9x9.1.cnf/
      run: >
        codspeed run --mode simulation --
        ./${{env.artifact}}/benchs/herbrand-sat-bench
        +RTS -A32m -T -V0 -I0 --copying-gc -RTS
    # The suite exits zero and prints results even when nothing was reported to
    # CodSpeed -- it just falls back to tasty-bench's own timing loop. Assert the
    # sidecar exists and has a row per benchmark, so a silent fallback fails here
    # rather than showing up as an empty run on the dashboard much later.
    - name: Check the run was actually measured
      if: always()
      run: |
        [ -f allocation.csv ] || {
          echo "::error::the suite wrote no allocation sidecar"; exit 1; }
        rows=$(($(wc -l <allocation.csv) - 1))
        echo "sidecar rows: ${rows}"
        # 6 corpus files x 12 solver configurations. Exact, not a lower bound:
        # a pattern that silently stops matching is the failure this catches,
        # and it has caught it once already.
        [ "${rows}" -eq 72 ] || {
          echo "::error::expected 72 benchmark rows, got ${rows}"; exit 1; }
    - name: Upload allocation sidecar
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allocation-csv
        path: allocation.csv
        if-no-files-found: warn

  upload-reports:
    concurrency:
      cancel-in-progress: false
      group: "pages"
    permissions: 
      pages: write
      id-token: write
      contents: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    name: Upload Reports
    if: (github.head_ref || github.ref_name) != 'gh-pages'
    needs: [build, bench]
    runs-on: ubuntu-latest
    env:
      sha: ${{github.event.pull_request.head.sha || github.sha}}
      branch: ${{ github.head_ref || github.ref_name }}
      pages-dir: pages
    steps:
    - name: Checkout HEAD
      uses: actions/checkout@v4
      with:
        ref: ${{env.sha}}
    - name: Modify Branch Name
      run: git switch -c ${{env.branch}}
    - name: Checkout gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: ${{env.pages-dir}}
        token: ${{secrets.GITHUB_TOKEN}}
    - name: Download artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        path: workspace/downloads
    - name: Extract bench results and generate
      id: generate
      shell: bash
      run: |
        set -euxo pipefail
        DL_DIR="${{steps.download.outputs.download-path}}"
        WORKDIR=workspace
        tar xaf "${DL_DIR}/artifact-ghc-9.12.4/artifact-ghc-9.12.4.tar.zst" --directory="${WORKDIR}"
        ARTIFACT_DIRS=${WORKDIR}/artifact-ghc-9.12.4
        REPORT_DIR=${WORKDIR}/reports
        cat "${ARTIFACT_DIRS}/benchs.list" | while read -r BENCH; do
          DEST=${REPORT_DIR}/${BENCH}
          mkdir -p "${DEST}"
          ORIG_REPORT_NAME=${BENCH}-report
          tar xvf "${DL_DIR}/${ORIG_REPORT_NAME}/${ORIG_REPORT_NAME}.tar.gz" --directory "${DEST}" --strip-components=1
        done
        ls -R "${REPORT_DIR}"

        ARGS=(-c "${{env.pages-dir}}/reports.json" -i "${REPORT_DIR}" -o "${{env.pages-dir}}/docs/reports")
        ARGS+=(-R "${{github.event.repository.full_name}}")
        PULL=${{github.event.pull_request.number}}
        PULL_BASE_BRANCH=${{github.event.pull_request.head.ref}}
        PULL_BASE_COMMIT=${{github.event.pull_request.head.sha}}
        PULL_TITLE="${{github.event.pull_request.title}}"
        if [[ -n "${PULL}" ]]; then
          ARGS+=("--pull-number" "${PULL}")
          ARGS+=("--pull-title" "${PULL_TITLE}")
          ARGS+=("--pull-base-branch" "${PULL_BASE_BRANCH}")
          ARGS+=("--pull-base-commit" "${PULL_BASE_COMMIT}")
        fi

        ls -R "${{env.pages-dir}}"

        "${ARTIFACT_DIRS}/exes/bench-chart" update-report-pages "${ARGS[@]}"
    - name: Setup Pages
      uses: actions/configure-pages@v3
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        # Upload entire repository
        path: ${{env.pages-dir}}/docs
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    - name: Report to PR
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        URL: ${{ github.event.pull_request.html_url }}
      run: >
        gh pr comment ${{github.event.pull_request.number}}
        -b ":bar_chart: Benchmark report for ${{env.sha}} is uploaded to: ${{steps.generate.outputs.url}}"
    - name: Make commit
      run: |
        cd pages
        git config --global user.name "github-actions"
        git config --global user.email "github-actions"
        git add .
        git commit -m "[bot] Report for ${{env.sha}} (${{env.branch}})"
        git push origin gh-pages
